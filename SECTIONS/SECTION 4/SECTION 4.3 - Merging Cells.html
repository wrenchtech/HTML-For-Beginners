<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creation</title>
</head>
<body>

<table width="100%" border="1" bordercolor="blue" cellspacing="2" cellpadding="2"> 
    <tr> 
        <td colspan="2"><h1>My Expenses</h1></td><!--This is how you merge two cells into one, and the number is the number of cells you want to merge-->
    </tr>
    <tr>
        <td>Month</td> 
        <td>Amount</td> 
    </tr>

    <tr>
        <td>January</td>
        <td>$400</td>
    </tr>

    <tr>
        <td>February</td>
        <td>$600</td>
    </tr>

    <tr>
        <td>March</td>
        <td>$350</td>
    </tr>

    <tr>
        <td>Abril</td>
        <td>$350</td>
    </tr>

    <tr>
        <td>May</td>
        <td>$550</td>
    </tr>

    <tr>
        <td colspan="2" text align="right" ><strong>$2250</strong></td><!--This is how you merge two cells into one-->
    </tr>

</table> 
        
</body>
</html>
