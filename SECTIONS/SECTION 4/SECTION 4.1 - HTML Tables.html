<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creation</title>
</head>
<body>
    <table width="100%" border="1" bordercolor="blue" cellspacing="2" cellpadding="2">
        <tr> <!--This are the rows-->
            <td>Sports</td>
            <td>Responses</td> <!--This means it will be two columns, sports and responses (on this example) are the first row-->
        </tr>
        <tr>
            <td>Basketball</td> 
            <td>28</td> <!--This will be on the second row, now we have a 2x2 table-->
        </tr>

        <tr>
            <td>Baseball</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Hockey</td>
            <td>26</td>
        </tr>

        <tr>
            <td>Soccer</td>
            <td>22</td>
        </tr>

        <tr>
            <td>Tennis</td>
            <td>24</td>
        </tr>

        <tr>
            <td>Football</td>
            <td>30</td>
        </tr>

        <tr>
            <td>Other</td>
            <td>15</td> <!--Now we have an 8x2 table :)-->
        </tr>

    </table>

</body>
</html>
