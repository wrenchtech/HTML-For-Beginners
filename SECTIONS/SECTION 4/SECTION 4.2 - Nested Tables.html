<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Creation</title>
</head>
<body>
    <table width="100%" border="1" bordercolor="red" cellspacing="2" cellpadding="2"> <!--This is how you put a table inseide another-->
        <tr>
            <td>
                <table width="50%" border="1" bordercolor="blue" cellspacing="2" cellpadding="2">
                    <tr> 
                        <td>Sports</td>
                        <td>Responses</td>
                    </tr>
                    <tr>
                        <td>Basketball</td> 
                        <td>28</td> 
                    </tr>

                    <tr>
                        <td>Baseball</td>
                        <td>20</td>
                    </tr>

                    <tr>
                        <td>Hockey</td>
                        <td>26</td>
                    </tr>

                    <tr>
                        <td>Soccer</td>
                        <td>22</td>
                    </tr>

                    <tr>
                        <td>Tennis</td>
                        <td>24</td>
                    </tr>

                    <tr>
                        <td>Football</td>
                        <td>30</td>
                    </tr>

                    <tr>
                        <td>Other</td>
                        <td>15</td> 
                    </tr>

                </table>

            </td>
            <td>
                <table width="100%" border="1" bordercolor="blue" cellspacing="2" cellpadding="2"> <!--In this example there are 2 tables inside one-->
                    <tr> 
                        <td>Sports</td>
                        <td>Responses</td>
                    </tr>
                    <tr>
                        <td>Basketball</td> 
                        <td>28</td> 
                    </tr>

                    <tr>
                        <td>Baseball</td>
                        <td>20</td>
                    </tr>

                    <tr>
                        <td>Hockey</td>
                        <td>26</td>
                    </tr>

                    <tr>
                        <td>Soccer</td>
                        <td>22</td>
                    </tr>

                    <tr>
                        <td>Tennis</td>
                        <td>24</td>
                    </tr>

                    <tr>
                        <td>Football</td>
                        <td>30</td>
                    </tr>

                    <tr>
                        <td>Other</td>
                        <td>15</td> 
                    </tr>

                </table>
            </td>
        </tr>
    </table> <!--Two 2x8 tables inside a 2x1 table, how awesome!?-->
        
</body>
</html>
